# Module-import reachability, not a function-call or HTTP-routing proof.
version = 1
maintained = ["nexus/**/*.py", "scripts/**/*.py", "ir_eval/**/*.py", "migrations/*.py", "*.py"]
baseline = "config/reachability_baseline.json"

[production]
project_config = "pyproject.toml"
runtime_config = "nexus.toml"

[pytest]
config = "pytest.ini"

[migrations]
loader = "scripts/migrate.py:_load_python_migration"
loader_expression = "importlib.util.spec_from_file_location(module_name, path)"
pattern = "migrations/[0-9][0-9][0-9]_*.py"
symbol = "run"
script_only_versions = ["008"]
reason = "scripts/migrate.py discovers managed Python migrations and invokes run(conn); SQL migrations contain no Python imports."

[[operators]]
target = "scripts/character_identity_census.py:main"
reason = "Read-only identity census documented in docs/qa/799-identity-before-minting/verification.md."

[[operators]]
target = "scripts/measure_place_coordinate_costs.py:main"
reason = "Read-only place-coordinate cost report for 840-Q4; offline grammar weights plus read-only place counts (issue 840)."
[[operators]]
target = "scripts/migrate.py:main"
reason = "CLAUDE.md schema migration workflow."
[[operators]]
target = "scripts/new_story_setup.py:main"
reason = "CLAUDE.md slot initialization workflow."
[[operators]]
target = "scripts/rebuild_memory_idf.py:main"
reason = "CLAUDE.md and docs/database.md IDF rebuild after a PostgreSQL update; named by the analyzer-mismatch error and nexus doctor (issue 1013)."
[[operators]]
target = "scripts/qa_shift/qa_shift.py:main"
reason = "Authorized Night QA entry point; scripts/qa_shift/mission_prompt.md."
[[operators]]
target = "scripts/qa_shift/ann_gate.py:main"
reason = "Issue 766 measured ANN gate; read-only slot dump, index evaluation only on disposable qa640_766_* clones."

