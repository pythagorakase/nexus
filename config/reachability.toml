[[operators]]
target = "migrations/008_populate_mock_database.py:main"
reason = "SCRIPT_ONLY_MIGRATIONS explicitly identifies 008 as the manual seed executable."

[[import_aliases]]
source = "nexus/agents/lore/lore.py"
prefix = "utils"
target = "nexus.agents.lore.utils"
reason = "lore.py explicitly prepends its own directory to sys.path before importing utils."

[[forbidden_dependencies]]
source = "nexus/*"
target = "tests/*"
reason = "Application modules must not depend on the test suite."

# No tombstones are inferred from this graph. Future entries require an exact
# path/symbol/scoped literal/TOML key and an explicit retirement decision.

[[dynamic_edges]]
source = "tests/test_orrery/test_event_sources_pg.py:test_registered_retrograde_source_reaches_retained_gate"
expression = "import_module(module_name)"
target = "nexus/agents/orrery/retrograde_persistence.py"
reason = "The event-source PostgreSQL proof resolves the registered Retrograde producer entrypoint itself so stale writer names fail the contract test."

[[dynamic_edges]]
source = "tests/test_memnon_cross_encoder_artifact.py:_checkout_with_decoys"
expression = "importlib.util.spec_from_file_location('checkout_cross_encoder', source)"
target = "nexus/agents/memnon/utils/cross_encoder.py"
reason = "The reranker artifact contract test imports a copy of the real cross-encoder source from a temporary checkout layout to prove same-named checkout model folders are never loaded."

[[dynamic_edges]]
source = "tests/test_regenerate_embeddings_truncate_pg.py:test_truncate_table_keeps_rows_when_the_model_artifact_is_missing"
expression = "importlib.util.spec_from_file_location('regenerate_embeddings_probe', REPO_ROOT / 'scripts' / 'regenerate_embeddings.py')"
target = "scripts/regenerate_embeddings.py"
reason = "The truncate-safety PostgreSQL test imports the real script fresh after pointing NEXUS_RUNTIME_CONFIG at a registry whose local_path is missing, because the script reads its model registry at import time. This edge is test-only: the script (and scripts/utils/embedding_utils.py through it) still has no operator entry point and is import-era tooling for #811."

[[dynamic_edges]]
source = "tests/test_config/test_ir_eval_golden_overrides.py:_merge_golden_overrides"
expression = "importlib.util.spec_from_file_location('ir_eval_cli', REPO_ROOT / 'ir_eval' / 'ir_eval.py')"
target = "ir_eval/ir_eval.py"
reason = "The golden-query override test loads the V1 IR-evaluation CLI by file in a fresh interpreter to run its real override merge on the checked-in ir_eval/golden_queries.json. This edge is test-only: ir_eval/ir_eval.py (and the ir_eval/scripts modules it imports) still has no operator entry point."

[[import_search_paths]]
source = "scripts/*.py"
paths = ["scripts"]
reason = "Standalone scripts resolve sibling api_openai/api_batch helpers from their executable directory."
[[import_search_paths]]
source = "ir_eval/*.py"
paths = ["ir_eval", "ir_eval/scripts", "scripts"]
reason = "Legacy IR tools explicitly prepend ir_eval and its scripts directory to sys.path; repo scripts supplies api_openai. These edges do not promote tools to supported roots."

