[pytest]
testpaths = tests
norecursedirs = archive
asyncio_default_fixture_loop_scope = function
markers =
    requires_postgres: Tests that need a running PostgreSQL instance.
    requires_corpus: PostgreSQL tests that read a disposable data clone of an owner corpus slot.
    integration: Tests that call live model endpoints.
    live: Tests that exercise live external services.
    live_llm: Tests that exercise live OpenAI/Anthropic endpoints.
    requires_secret_store: Tests that use a disposable real platform secret store.
