name: Python reachability check

# Runs the ci-runner readiness contract (nexus/runtime/readiness.py, issue
# #803): `config.valid` loads nexus.toml through the Pydantic settings models,
# and `reachability.gate` starts `python -S scripts/check_reachability.py`, so
# the static import gate still runs without site-packages. Run the same thing
# from a checkout with `nexus doctor --target ci-runner --json`
# (docs/runtime.md, Readiness Checks).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  reachability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Editable, so the doctor's checkout root is this workspace.
      - name: Install NEXUS
        run: pip install -e .
      - name: Run the ci-runner readiness checks
        shell: bash
        run: nexus doctor --target ci-runner --json | tee readiness-report.json
      - name: Save readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-runner-readiness
          path: readiness-report.json
          if-no-files-found: ignore
