name: Exception disposition check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  exception-dispositions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Stdlib only; each interpreter checks the same committed baseline.
      - name: Run exception disposition lint
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python -S scripts/check_exception_dispositions.py --baseline-base-ref "$BASE_REF"
